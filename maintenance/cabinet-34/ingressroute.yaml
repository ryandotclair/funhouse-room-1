apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: funhouse-room-room1
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`riddler.rycr.io`) && PathPrefix(`/r/mxmNaRd6GuKE`)
      kind: Rule
      services:
        - name: funhouse-room-room1
          port: 80
      middlewares:
        - name: funhouse-room-room1-strip
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: funhouse-room-room1-strip
spec:
  stripPrefix:
    prefixes:
      - /r/mxmNaRd6GuKE
