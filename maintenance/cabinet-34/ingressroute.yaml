apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: funhouse-room-room1
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`riddler.rycr.io`) && PathPrefix(`/r/GJ2vQ7bXoCoQ`)
      kind: Rule
      services:
        - name: funhouse-room-room1
          port: 80
      middlewares:
        - name: funhouse-room-room1-strip
  # Use Traefik entrypoint / default cert store (TLS secret stays in app ns).
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: funhouse-room-room1-strip
spec:
  stripPrefix:
    prefixes:
      - /r/GJ2vQ7bXoCoQ
